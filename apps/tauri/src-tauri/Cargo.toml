[package]
name = "nameless-liberty"
version = "0.0.1"
description = "NamelessLiberty Desktop App"
authors = ["NamelessLiberty"]
edition = "2021"

[lib]
name = "nameless_liberty_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
sysinfo = "0.33"
