kind: pipeline
type: docker
name: default

clone:
  disable: true

steps:
  - name: Clone
    image: alpine/git:latest
    environment:
      REDIS_PASSWORD:
        from_secret: REDIS_PASSWORD
      POSTGRE_USER:
        from_secret: POSTGRE_USER
      POSTGRE_PASS:
        from_secret: POSTGRE_PASS
      POSTGRE_DB:
        from_secret: POSTGRE_DB
      INFISICAL_ENCRYPTION_KEY:
        from_secret: INFISICAL_ENCRYPTION_KEY
      INFISICAL_AUTH_SECRET:
        from_secret: INFISICAL_AUTH_SECRET
      INFISICAL_SITE_URL:
        from_secret: INFISICAL_SITE_URL
    commands:
      - git init
      - git remote add origin ${DRONE_REMOTE_URL} || git remote set-url origin ${DRONE_REMOTE_URL}
      - git fetch --depth=1 origin +refs/heads/${DRONE_COMMIT_BRANCH}:refs/remotes/origin/${DRONE_COMMIT_BRANCH}
      - git checkout -f ${DRONE_COMMIT_SHA}
      - |
        cat << EOF > .env
        REDIS_PASSWORD=$REDIS_PASSWORD
        POSTGRE_USER=$POSTGRE_USER
        POSTGRE_PASS=$POSTGRE_PASS
        POSTGRE_DB=$POSTGRE_DB
        INFISICAL_ENCRYPTION_KEY=$INFISICAL_ENCRYPTION_KEY
        INFISICAL_AUTH_SECRET=$INFISICAL_AUTH_SECRET
        INFISICAL_SITE_URL=$INFISICAL_SITE_URL
        EOF
      - chmod 600 .env

  - name: Redis
    image: docker:latest
    volumes:
      - name: docker_sock
        path: /var/run/docker.sock
    commands:
      - docker compose up -d redis
      - |
        for i in $(seq 1 30); do
          if [ "$(docker inspect -f '{{.State.Health.Status}}' NamelessLiberty-Redis 2>/dev/null)" = "healthy" ]; then
            echo "NamelessLiberty-Redis is healthy."
            break
          fi
          sleep 2
        done
    depends_on:
      - Clone

  - name: Postgre
    image: docker:latest
    volumes:
      - name: docker_sock
        path: /var/run/docker.sock
    commands:
      - docker compose up -d postgre
      - |
        for i in $(seq 1 30); do
          if [ "$(docker inspect -f '{{.State.Health.Status}}' NamelessLiberty-Postgre 2>/dev/null)" = "healthy" ]; then
            echo "NamelessLiberty-Postgre is healthy."
            break
          fi
          sleep 2
        done
    depends_on:
      - Clone

  - name: databasus
    image: docker:latest
    volumes:
      - name: docker_sock
        path: /var/run/docker.sock
    commands:
      - docker compose up -d --no-deps databasus
    depends_on:
      - Clone

  - name: infisical
    image: docker:latest
    volumes:
      - name: docker_sock
        path: /var/run/docker.sock
    commands:
      - docker compose up -d --no-deps infisical
      - |
        for i in $(seq 1 30); do
          if [ "$(docker inspect -f '{{.State.Running}}' NamelessLiberty-Infisical 2>/dev/null)" = "true" ]; then
            echo "NamelessLiberty-Infisical is running."
            break
          fi
          sleep 2
        done
    depends_on:
      - Clone

  - name: Environment
    image: oven/bun:latest
    environment:
      INFISICAL_TOKEN:
        from_secret: INFISICAL_TOKEN
      INFISICAL_PROJECT_ID:
        from_secret: INFISICAL_PROJECT_ID
      INFISICAL_SITE_URL:
        from_secret: INFISICAL_SITE_URL
    commands:
      - |
        ARCH=$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')
        bun -e "const r = await fetch('https://github.com/Infisical/cli/releases/download/v0.45.6/cli_0.45.6_linux_' + process.argv[1] + '.tar.gz'); if (!r.ok) throw new Error('Failed to download infisical CLI: ' + r.statusText); await Bun.write('/tmp/infisical.tar.gz', r);" "$ARCH"
        tar -xzf /tmp/infisical.tar.gz -C /usr/local/bin infisical
        rm -f /tmp/infisical.tar.gz
        infisical export --token="$INFISICAL_TOKEN" --projectId="$INFISICAL_PROJECT_ID" --env="prod" --domain="$(printf '%s' "$INFISICAL_SITE_URL" | sed 's|/$||')/api" --format=dotenv >> .env
      - chmod 600 .env
      - bun install --frozen-lockfile
      - cp /usr/local/bin/infisical node_modules/.bin/infisical
    depends_on:
      - Redis
      - Postgre
      - databasus
      - infisical

  - name: RustFS
    image: docker:latest
    volumes:
      - name: docker_sock
        path: /var/run/docker.sock
    commands:
      - docker compose up -d rustfs
    depends_on:
      - Environment

  - name: deemix
    image: docker:latest
    volumes:
      - name: docker_sock
        path: /var/run/docker.sock
    commands:
      - docker compose up -d deemix
    depends_on:
      - Environment

  - name: searxng
    image: docker:latest
    volumes:
      - name: docker_sock
        path: /var/run/docker.sock
    commands:
      - docker compose create searxng
      - docker cp core-config/settings.yml NamelessLiberty-SearXNG:/etc/searxng/settings.yml
      - docker cp core-config/limiter.toml NamelessLiberty-SearXNG:/etc/searxng/limiter.toml
      - docker compose up -d searxng
      - docker compose restart searxng
    depends_on:
      - Environment

  - name: Prisma Contract
    image: oven/bun:latest
    environment:
      INFISICAL_TOKEN:
        from_secret: INFISICAL_TOKEN
      INFISICAL_SITE_URL:
        from_secret: INFISICAL_SITE_URL
      INFISICAL_ENV: prod
    commands:
      - INFISICAL_API_URL="$(printf '%s' "$INFISICAL_SITE_URL" | sed 's|/$||')/api" bun run --filter=@NamelessLiberty/db contract:emit
    depends_on:
      - RustFS
      - deemix
      - searxng

  - name: Prisma Update
    image: oven/bun:latest
    environment:
      INFISICAL_TOKEN:
        from_secret: INFISICAL_TOKEN
      INFISICAL_SITE_URL:
        from_secret: INFISICAL_SITE_URL
    commands:
      - |
        HOST_IP=$(bun -e "const gw = (await Bun.file('/proc/net/route').text()).split(String.fromCharCode(10)).map(l => l.trim().split(String.fromCharCode(9))).find(c => c[1] === '00000000')?.[2]; console.log(gw ? gw.match(/../g).reverse().map(h => parseInt(h, 16)).join('.') : '172.17.0.1');")
        PATH="$PWD/node_modules/.bin:$PATH" INFISICAL_API_URL="$(printf '%s' "$INFISICAL_SITE_URL" | sed 's|/$||')/api" infisical run --env=prod -- sh -c "cd packages/database && POSTGRE_HOST=$HOST_IP POSTGRE_PORT=10001 bunx prisma db update"
    depends_on:
      - Prisma Contract

  - name: Packages
    image: oven/bun:latest
    environment:
      INFISICAL_TOKEN:
        from_secret: INFISICAL_TOKEN
      INFISICAL_SITE_URL:
        from_secret: INFISICAL_SITE_URL
      INFISICAL_ENV: prod
    commands:
      - INFISICAL_API_URL="$(printf '%s' "$INFISICAL_SITE_URL" | sed 's|/$||')/api" bun run build:packages
    depends_on:
      - Prisma Update

  - name: Elysia
    image: docker:latest
    environment:
      INFISICAL_TOKEN:
        from_secret: INFISICAL_TOKEN
      INFISICAL_SITE_URL:
        from_secret: INFISICAL_SITE_URL
    volumes:
      - name: docker_sock
        path: /var/run/docker.sock
    commands:
      - export DOCKER_BUILDKIT=1 COMPOSE_DOCKER_CLI_BUILD=1
      - |
        PKG_VERSION=$(sed -n 's/.*"version":[[:space:]]*"\([^"]*\)".*/\1/p' apps/elysia/package.json | head -n 1)
        echo "Building NamelessLiberty-Elysia v$PKG_VERSION..."
        APP_VERSION="$PKG_VERSION" docker compose build --build-arg APP_VERSION="$PKG_VERSION" elysia
        APP_VERSION="$PKG_VERSION" docker compose up -d --no-deps elysia
    depends_on:
      - Packages

  - name: Next
    image: docker:latest
    environment:
      INFISICAL_TOKEN:
        from_secret: INFISICAL_TOKEN
      INFISICAL_SITE_URL:
        from_secret: INFISICAL_SITE_URL
    volumes:
      - name: docker_sock
        path: /var/run/docker.sock
    commands:
      - export DOCKER_BUILDKIT=1 COMPOSE_DOCKER_CLI_BUILD=1
      - |
        PKG_VERSION=$(sed -n 's/.*"version":[[:space:]]*"\([^"]*\)".*/\1/p' apps/next/package.json | head -n 1)
        echo "Building NamelessLiberty-Next v$PKG_VERSION..."
        APP_VERSION="$PKG_VERSION" docker compose build --build-arg APP_VERSION="$PKG_VERSION" next
        APP_VERSION="$PKG_VERSION" docker compose up -d --no-deps next
    depends_on:
      - Elysia

  - name: Jellyborealis - Build
    image: mcr.microsoft.com/dotnet/sdk:10.0
    environment:
      GITHUB_TOKEN:
        from_secret: github_token
    commands:
      - apt-get update && apt-get install -y python3
      - python3 plugins/JellyBorealis/package.py
    depends_on:
      - Next

  - name: Jellyborealis - Release
    image: mcr.microsoft.com/dotnet/sdk:10.0
    environment:
      GITHUB_TOKEN:
        from_secret: github_token
    commands:
      - apt-get update && apt-get install -y python3
      - python3 plugins/JellyBorealis/package.py --ci --skip-build
    depends_on:
      - Jellyborealis - Build

  - name: NamelessLiberty - Build Linux
    image: oven/bun:latest
    commands:
      - apt-get update && apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
      - export PATH="$HOME/.cargo/bin:$PATH"
      - bun --cwd apps/tauri tauri build
      - mkdir -p releases/NamelessLiberty
      - cp -f apps/tauri/src-tauri/target/release/bundle/appimage/*.AppImage releases/NamelessLiberty/ 2>/dev/null || true
      - cp -f apps/tauri/src-tauri/target/release/bundle/deb/*.deb releases/NamelessLiberty/ 2>/dev/null || true
      - cp -f apps/tauri/src-tauri/target/release/bundle/rpm/*.rpm releases/NamelessLiberty/ 2>/dev/null || true
    depends_on:
      - Jellyborealis - Release

  - name: NamelessLiberty - Build Windows
    image: oven/bun:latest
    commands:
      - apt-get update && apt-get install -y build-essential curl nsis lld llvm clang
      - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
      - export PATH="$HOME/.cargo/bin:$PATH"
      - rustup target add x86_64-pc-windows-msvc
      - cargo install cargo-xwin
      - bun --cwd apps/tauri tauri build --runner cargo-xwin --target x86_64-pc-windows-msvc
      - mkdir -p releases/NamelessLiberty
      - cp -f apps/tauri/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe releases/NamelessLiberty/ 2>/dev/null || true
    depends_on:
      - Jellyborealis - Release

  - name: NamelessLiberty - Build Android
    image: oven/bun:latest
    commands:
      - apt-get update && apt-get install -y build-essential curl unzip default-jdk
      - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
      - export PATH="$HOME/.cargo/bin:$PATH"
      - rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android i686-linux-android
      - export ANDROID_HOME=/opt/android-sdk
      - export NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
      - export JAVA_HOME="$(dirname "$(dirname "$(readlink -f "$(which javac)")")")"
      - mkdir -p "$ANDROID_HOME/cmdline-tools"
      - curl -sSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/cmdline-tools.zip
      - unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-tools && mv /tmp/cmdline-tools/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest" && rm -rf /tmp/cmdline-tools /tmp/cmdline-tools.zip
      - yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
      - '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"'
      - if [ ! -d apps/tauri/src-tauri/gen/android ]; then bun --cwd apps/tauri tauri android init; fi
      - bun --cwd apps/tauri tauri android build --apk
      - mkdir -p releases/NamelessLiberty
      - find apps/tauri/src-tauri/gen/android/app/build/outputs/apk -name "*.apk" -exec cp -f {} releases/NamelessLiberty/ \;
    depends_on:
      - Jellyborealis - Release

  - name: NamelessLiberty - Release
    image: oven/bun:latest
    environment:
      GITHUB_TOKEN:
        from_secret: github_token
    commands:
      - bun apps/tauri/release.ts
    depends_on:
      - NamelessLiberty - Build Linux
      - NamelessLiberty - Build Windows
      - NamelessLiberty - Build Android

  - name: Verify its running
    image: docker:latest
    volumes:
      - name: docker_sock
        path: /var/run/docker.sock
    commands:
      - docker compose ps
      - |
        FAILED=0
        for CONTAINER in \
          NamelessLiberty-Redis \
          NamelessLiberty-Postgre \
          NamelessLiberty-Infisical \
          NamelessLiberty-RustFS \
          NamelessLiberty-Deemix \
          NamelessLiberty-SearXNG \
          NamelessLiberty-Elysia \
          NamelessLiberty-Next \
          NamelessLiberty-Databasus; do
          STATE=$(docker inspect -f '{{.State.Running}}' "$CONTAINER" 2>/dev/null || echo "false")
          if [ "$STATE" != "true" ]; then
            echo "ERROR: $CONTAINER is not running!"
            docker logs "$CONTAINER" --tail=50 || true
            FAILED=1
          else
            echo "OK: $CONTAINER is running."
          fi
        done
        docker compose logs elysia --tail=30
        docker compose logs next --tail=30
        exit $FAILED
    depends_on:
      - NamelessLiberty - Release
      - databasus

  - name: Cleanup
    image: docker:latest
    volumes:
      - name: docker_sock
        path: /var/run/docker.sock
    commands:
      - rm -f .env
      - docker image prune -f
    depends_on:
      - Verify its running
    when:
      status:
        - success
        - failure

volumes:
  - name: docker_sock
    host:
      path: /var/run/docker.sock

trigger:
  branch:
    - main
  event:
    - push
